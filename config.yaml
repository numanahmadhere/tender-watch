# TenderWatch configuration. Edit keywords freely; the daily run reads this file.

lookback_days: 30            # for notices without a deadline, and for awards
request_delay_seconds: 1.2   # minimum gap between requests to the same host (plus random jitter)

keywords:
  min_score: 3               # a tender needs at least this score to be reported
  strong_score: 6            # at or above this, exclusion phrases no longer drop a tender
  groups:
    ai:
      weight: 5
      max_hits: 2
      terms: [artificial intelligence, AI, machine learning, AI/ML, deep learning, generative AI,
              large language model, LLM, chatbot, computer vision, NLP, natural language processing,
              predictive analytics, predictive model, intelligent automation]
    data:
      weight: 3
      max_hits: 2
      terms: [data analytics, data analysis, data science, data scientist, data warehouse, data lake,
              data platform, data governance, data management, data integration, data quality,
              data engineering, data strategy, big data, business intelligence, BI, analytics,
              dashboard, MIS, management information system, open data]
    digital:
      weight: 3
      max_hits: 2
      terms: [digital transformation, digitization, digitalization, digitisation, e-government,
              e-governance, digital government, digital platform, digital service, e-services,
              automation, robotic process automation, RPA, ERP, enterprise resource planning,
              software development, software solution, mobile app, mobile application, web portal,
              web application, e-procurement, document management, workflow, GIS, geospatial,
              IoT, internet of things, cloud, cloud migration, fintech, digital payments, OCR,
              IT consultancy, IT strategy, ICT strategy, digital literacy]
  exclude: [stationery, furniture, tyre, syrup, injection, tablet, capsule, medicine, pharmaceutical,
            surgical, uniform, catering, fumigation, laundry, diesel, petrol, cement, rubber stamp,
            printing of, repair of road, construction of, supply of vehicle]

# type: worldbank | epms_tenders | epads | generic_table | ungm
# Each source is isolated: a failure shows up in the email's "Source health" table.
sources:
  - {name: worldbank, type: worldbank, max_pages: 120}
  - {name: epms_tenders, type: epms_tenders, max_pages: 60}
  - {name: epads_federal, type: epads, jurisdiction: federal, max_pages: 30}
  - {name: epads_kp, type: epads, jurisdiction: kp, max_pages: 15}

  # Awards and evaluations (winners and amounts). Layout unverified: parsed by column headers.
  - name: epms_awards
    type: generic_table
    kind: award
    urls: [https://epms.ppra.gov.pk/public/contracts, https://epms.ppra.gov.pk/public/evaluations]
    max_pages: 5
    experimental: true

  # Provincial and regional portals. Several publish a robots.txt that disallows automated
  # access; those are skipped automatically and reported as "skipped".
  - {name: punjab_eproc, type: generic_table, url: "https://eproc.punjab.gov.pk/ActiveTenders.aspx", experimental: true}
  - {name: kppra, type: generic_table, url: "https://www.kppra.gov.pk/kppra/activetenders", experimental: true}
  - {name: sindh_ppms, type: generic_table, url: "https://ppms.pprasindh.gov.pk/PPMS/public/portal/notice-inviting-tender", experimental: true}
  - {name: balochistan, type: generic_table, url: "https://bppthree.vdc.services/tenderssearch/", experimental: true}
  - {name: gb_ppra, type: gb_ppra, url: "https://www.gbppra.gov.pk/viewall", max_pages: 6}
  - {name: ajk_ppra, type: generic_table, url: "https://www.ajkppra.gov.pk/advertisements.php", experimental: true}

  # International. UNGM stays disabled: it returns 403 to automated clients and I do not work around that. UNGM is JavaScript rendered; ADB lists by country (pak = Pakistan).
  - {name: ungm, enabled: false, type: ungm, max_pages: 20, experimental: true}
  - {name: adb, enabled: false, type: rendered_table, url: "https://www.adb.org/projects/tenders", contains: pakistan, experimental: true}

  # Section 1: international and donor sources reachable from GitHub (no keys needed).
  - {name: ted, type: ted, lookback_days: 30, max_pages: 5, experimental: true}
  - {name: contracts_finder, type: contracts_finder, lookback_days: 14, max_pages: 8, contains: pakistan, experimental: true}
  # undp disabled: its robots.txt forbids automated access.
  - {name: undp, enabled: false, type: generic_table, url: "https://procurement-notices.undp.org/", contains: "UNDP-PAK", experimental: true}

  # Section 2: early signals, before a tender exists. World Bank pipeline projects for Pakistan.
  - {name: wb_pipeline, type: wb_pipeline, statuses: [Pipeline]}

  # Disabled after run 2: pseb and ignite URLs gave 404 (Ignite posts on EPMS, already covered);
  # nitb, nadra and secp return 403 to automated clients.
  # Disabled after the discover run: sbp and adb sit behind a Cloudflare bot challenge (not bypassed),
  # aiib renders no table, and psdf's URL was an image. Re-enable only with a verified URL.
  # rendered_table is for pages that build their lists with JavaScript, so they use a headless browser (rendered_table).
  # Section 4: buyers that publish their own tenders. URLs are best guesses: check the Source
  # health table after the first run and fix or disable any that error.
  - {name: sbp, enabled: false, type: rendered_table, url: "https://www.sbp.org.pk/online-tenders", experimental: true}
  - {name: pitb, type: generic_table, url: "https://pitb.gov.pk/tendernotices", max_pages: 3, page_base: 0}
  - {name: pseb, enabled: false, type: generic_table, url: "https://pseb.org.pk/tenders", experimental: true}
  - {name: nitb, enabled: false, type: generic_table, url: "https://nitb.gov.pk/tenders", experimental: true}
  - {name: ignite, enabled: false, type: generic_table, url: "https://ignite.org.pk/tenders/", experimental: true}
  - {name: nadra, enabled: false, type: generic_table, url: "https://www.nadra.gov.pk/tenders/", experimental: true}
  - {name: fbr, type: generic_table, url: "https://www.fbr.gov.pk/tenders", experimental: true}
  - {name: secp, enabled: false, type: generic_table, url: "https://www.secp.gov.pk/tenders/", experimental: true}

  # Early signals from news feeds (ECNEC approvals, funded programmes, RFP announcements).
  # Items need a tender-ish word to pass, then the usual AI/data/digital keyword score.
  # Google News RSS is not used: its robots.txt forbids automated readers.
  - name: news
    type: feed
    experimental: true
    urls:
      - https://propakistani.pk/feed/
      - https://www.techjuice.pk/feed/
      - https://www.app.com.pk/feed/
      - https://www.dawn.com/feeds/business
      - https://www.brecorder.com/feeds/latest-news
      - https://tribune.com.pk/feed/business
  - {name: aiib, enabled: false, type: rendered_table, url: "https://www.aiib.org/en/opportunities/business/project-procurement/list.html", contains: pakistan, experimental: true}

  # Added after exploring buyers that match Densight's work. MoITT's page is a plain table
  # (Title, Type, Status, Advertisement Date, Closing Date, Download) and lists the AI Hubs and
  # AI Capacity Building training RFPs. NAVTTC and PSDF are skills/training buyers whose pages
  # I could not inspect; they load through the headless browser and report health either way.
  - {name: moitt, type: generic_table, url: "https://moitt.gov.pk/Tenders", experimental: true}
  - {name: navttc, type: rendered_table, url: "https://navttc.gov.pk/notices/", experimental: true}
  - {name: psdf, enabled: false, type: rendered_table, url: "https://www.psdf.org.pk/tenders/", experimental: true}
